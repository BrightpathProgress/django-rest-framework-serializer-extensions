[tox]
envlist =
    black
    flake8
    codecov
    docs
    {py310,py311,py312}-django{42}-drf{315,316,3161}
    {py310,py311,py312,py313,py314}-django{52}-drf{3161}

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314,black,flake8,docs

[testenv]
setenv =
    PYTHONDONTWRITEBYTECODE=1
commands = pytest {posargs}
deps =
    django42: Django==4.2
    django52: Django==5.2
    django60: Django==6.0
    drf315: djangorestframework==3.15
    drf316: djangorestframework==3.16.0
    drf3161: djangorestframework==3.16.1
extras = test

[testenv:black]
commands = black rest_framework_serializer_extensions tests --check --diff
skip_install = true
deps =
    -crequirements-dev.txt
    black

[testenv:flake8]
commands = flake8 rest_framework_serializer_extensions tests
skip_install = true
deps =
    -crequirements-dev.txt
    flake8

[testenv:isort]
commands = isort rest_framework_serializer_extensions tests setup.py  --check-only
skip_install = true
deps =
    -crequirements-dev.txt
    isort

[testenv:codecov]
commands =
    pytest --cov --cov-report=xml  # Run the tests and generate coverage report
    codecov -e TOX_ENV   # Post coverage stats to codecov.io
extras =
    test
    coverage

[testenv:docs]
commands = mkdocs build
deps =
    mkdocs>=1.6.1
